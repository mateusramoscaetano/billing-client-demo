<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Painel — Cliente demo NestLab</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, sans-serif;
      background: #0a0a0a;
      color: #e4e4e7;
      padding: 2rem 1rem;
    }
    .wrap { max-width: 560px; margin: 0 auto; }
    .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    h1 { font-size: 1.1rem; margin: 0; }
    .user { font-size: 0.7rem; color: #71717a; }
    button.logout {
      padding: 0.45rem 0.85rem;
      border-radius: 0.75rem;
      border: 1px solid #3f3f46;
      background: transparent;
      color: #e4e4e7;
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
      width: auto;
    }
    .card {
      margin-top: 1rem;
      padding: 1rem 1.25rem;
      border-radius: 1.25rem;
      border: 1px solid #27272a;
      background: #111;
      font-size: 0.75rem;
      line-height: 1.5;
    }
    .card.warn { border-color: #f59e0b55; background: #1a1508; }
    .card.stop { border-color: #ef444455; background: #1a0a0a; }
    .card.ok { border-color: #00ff5f33; }
    pre {
      margin: 0.5rem 0 0;
      padding: 0.75rem;
      background: #000;
      border-radius: 0.75rem;
      overflow: auto;
      font-size: 0.65rem;
      color: #a1a1aa;
    }
    a { color: #00ff5f; }
    h2 { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: #71717a; margin: 1.5rem 0 0.5rem; }
    .blocked {
      display: none;
      margin-top: 1rem;
      padding: 1rem;
      border-radius: 1rem;
      background: #1a0a0a;
      border: 1px solid #ef4444;
      color: #fecaca;
      font-size: 0.8rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <h1>Painel do cliente</h1>
        <p class="user" id="userLabel">—</p>
      </div>
      <button type="button" class="logout" id="logoutBtn">Sair</button>
    </div>
    <div id="blockedOverlay" class="blocked">Acesso bloqueado: serviço cortado por inadimplência. Regularize o pagamento na NestLab.</div>
    <div id="billingCard" class="card">Carregando status de billing…</div>
    <h2>Webhooks da NestLab</h2>
    <div id="notices" class="card"><span style="color:#71717a">Nenhum aviso recebido ainda.</span></div>
  </div>
  <script>
    const billingCard = document.getElementById('billingCard');
    const noticesEl = document.getElementById('notices');
    const userLabel = document.getElementById('userLabel');
    const blockedOverlay = document.getElementById('blockedOverlay');

    function renderBilling(b) {
      billingCard.className = 'card';
      if (b.action === 'stopped') billingCard.classList.add('stop');
      else if (b.delinquent) billingCard.classList.add('warn');
      else billingCard.classList.add('ok');

      blockedOverlay.style.display = b.action === 'stopped' ? 'block' : 'none';

      let html = '<strong>Status NestLab (check no login)</strong><br/>';
      if (b.action === 'ok' && !b.delinquent) {
        html += 'Conta em dia. Uso liberado neste app de demonstração.';
      } else if (b.action === 'warn') {
        html += `Inadimplente: ${b.daysRemaining} dia(s) até possível corte no Coolify.<br/>`;
        html += `Corte em: ${b.cutoffAt ? new Date(b.cutoffAt).toLocaleString('pt-BR') : '—'}`;
      } else if (b.action === 'stopped') {
        html += 'Serviço interrompido (CUT). NestLab deve ter parado o container no Coolify.';
      }
      if (b.regularizeUrl) {
        html += `<br/><a href="${b.regularizeUrl}" target="_blank" rel="noopener">Regularizar na NestLab</a>`;
      }
      if (b.invoiceUrl) {
        html += `<br/><a href="${b.invoiceUrl}" target="_blank" rel="noopener">Pagar fatura Asaas</a>`;
      }
      html += '<pre>' + JSON.stringify(b, null, 2) + '</pre>';
      billingCard.innerHTML = html;
    }

    async function loadSession() {
      const res = await fetch('/api/me', { credentials: 'same-origin' });
      const data = await res.json().catch(() => ({}));
      if (res.status === 401) {
        window.location.href = '/';
        return;
      }
      if (data.user?.username) userLabel.textContent = 'Logado como ' + data.user.username;
      if (data.billing) renderBilling(data.billing);
      else if (data.error) {
        billingCard.className = 'card stop';
        billingCard.innerHTML = '<strong>Erro ao consultar NestLab</strong><p style="margin:0.5rem 0 0">' + data.error + '</p><pre>' + JSON.stringify(data, null, 2) + '</pre>';
      }
    }

    async function loadNotices() {
      const res = await fetch('/api/billing/notices');
      if (res.status === 401) return;
      const json = await res.json();
      if (!json.notices?.length) return;
      noticesEl.innerHTML = json.notices.map(n => (
        '<div style="margin-bottom:0.75rem;padding-bottom:0.75rem;border-bottom:1px solid #27272a">'
        + '<span style="color:#71717a">' + n.receivedAt + '</span><pre>'
        + JSON.stringify(n.body, null, 2) + '</pre></div>'
      )).join('');
    }

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/';
    });

    loadSession();
    loadNotices();
    setInterval(loadNotices, 5000);
  </script>
</body>
</html>
